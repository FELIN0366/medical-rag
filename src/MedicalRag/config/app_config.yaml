milvus:
  uri: http://localhost:19530
  token: null
  collection_name: medical_knowledge
  drop_old: false

embedding:
  summary_dense:
    provider: local_hash
    model: deterministic-hash-1024
    dimension: 1024
  text_dense:
    provider: local_hash
    model: deterministic-hash-1024
    dimension: 1024
  text_sparse:
    provider: Milvus

llm:
  provider: ollama
  model: qwen3:32b
  base_url: http://localhost:11434
  temperature: 0.1

data:
  default_source: qa
  default_source_name: huatuo_qa

multi_dialogue_rag:
  estimate_token_fun: tiktoken
  llm_max_token: 102400
  cut_dialogue_scale: 2
  max_token_threshold: 1.01
  smith_debug: false
  console_debug: true
  thinking_in_context: false

agent:
  mode: analysis
  max_attempts: 2
  network_search_enabled: true
  network_search_cnt: 10
  auto_search_param: true
